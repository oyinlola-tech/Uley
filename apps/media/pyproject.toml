[project]
name = "uley-media-safety"
version = "0.1.0"
description = "Private image and complaint video validation and malware scanning service for Uley"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
